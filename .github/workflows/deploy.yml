name: Deploy to GitHub Pages

on:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck, lint, test
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Measure coverage
        run: npx vitest run --coverage --coverage.reporter=json-summary

      - name: Write coverage badge
        run: |
          node -e '
            const fs = require("fs");
            const s = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8"));
            const pct = s.total.lines.pct;
            const color = pct >= 80 ? "brightgreen" : pct >= 60 ? "yellow" : "red";
            fs.mkdirSync("dist", { recursive: true });
            fs.writeFileSync("dist/coverage-badge.json", JSON.stringify({
              schemaVersion: 1,
              label: "coverage",
              message: Math.round(pct) + "%",
              color,
            }));
          '

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
