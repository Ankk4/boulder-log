name: CI

on:
  pull_request:
  push:
    branches-ignore: ['master']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck, lint, test
        run: npm run verify
      - name: Build
        run: npx vite build
